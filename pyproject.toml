[project]
name = "flight-watch-agent"
version = "0.1.0"
description = "A LangGraph-based flight price watch agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.0.0",
    "langchain-openai>=1.0.0",
    "langgraph>=0.2.60",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
flight-watch = "flight_watch_agent.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
